<svg xmlns="http://www.w3.org/2000/svg" width="680" height="714" viewBox="0 0 680 714" role="img">
<title>홈서버 현재 구조</title>
<desc>집 밖에서 Route 53과 공유기 포트포워딩을 거쳐 미니PC 두 대로 들어간다. 1번은 Proxmox로 Jenkins, Job 서버, NAS, Ubuntu VM을 올려두는 서비스용이고, 2번은 네이티브 Ubuntu로 개인 서버다.</desc>
<style>
  .t  { font: 14px system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; fill: #2C2C2A }
  .th { font: 500 14px system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; fill: #2C2C2A }
  .ts { font: 12px system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; fill: #5F5E5A }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none }
  .gl { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="318" y="30" width="44" height="44" rx="6" fill="#5F5E5A"/><g class="gl" transform="translate(328,40)"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v3M8 20h8"/></g>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">집 밖에서 접속</text>
<line class="arr" x1="340" y1="102" x2="340" y2="122" marker-end="url(#arrow)"/>

<rect x="200" y="126" width="280" height="108" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="216" y="144" dominant-baseline="central">AWS</text>
<rect x="318" y="150" width="44" height="44" rx="6" fill="#534AB7"/><g class="gl" transform="translate(328,160)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></g>
<text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central">Amazon Route 53</text>
<text class="ts" x="340" y="226" text-anchor="middle" dominant-baseline="central">도메인 A 레코드</text>
<line class="arr" x1="340" y1="244" x2="340" y2="268" marker-end="url(#arrow)"/>

<rect x="40" y="272" width="600" height="422" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="58" y="292" dominant-baseline="central">집 네트워크</text>
<rect x="318" y="302" width="44" height="44" rx="6" fill="#5F5E5A"/><g class="gl" transform="translate(328,312)"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M8 13 5 6M16 13l3-7"/><circle cx="12" cy="16.5" r="1.2"/></g>
<text class="th" x="340" y="362" text-anchor="middle" dominant-baseline="central">공유기</text>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">포트포워딩</text>
<path class="arr" d="M340 390 L340 404 L206 404 L206 412" marker-end="url(#arrow)"/>
<path class="arr" d="M340 390 L340 404 L500 404 L500 412" marker-end="url(#arrow)"/>

<rect x="56" y="416" width="300" height="256" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="206" y="440" text-anchor="middle" dominant-baseline="central" fill="#085041">미니PC 1 · Proxmox VE</text>
<text class="ts" x="206" y="458" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">서비스를 올려두는 곳</text>

<rect x="112" y="478" width="44" height="44" rx="6" fill="#185FA5"/><g class="gl" transform="translate(122,488)"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></g>
<text class="th" x="134" y="538" text-anchor="middle" dominant-baseline="central" fill="#085041">Jenkins</text>
<text class="ts" x="134" y="554" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">빌드 서버</text>

<rect x="256" y="478" width="44" height="44" rx="6" fill="#185FA5"/><g class="gl" transform="translate(266,488)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.6 2.1"/></g>
<text class="th" x="278" y="538" text-anchor="middle" dominant-baseline="central" fill="#085041">Job 서버</text>
<text class="ts" x="278" y="554" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">배치 작업</text>

<rect x="112" y="574" width="44" height="44" rx="6" fill="#0F6E56"/><g class="gl" transform="translate(122,584)"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="10" width="18" height="5" rx="1.5"/><rect x="3" y="16" width="18" height="5" rx="1.5"/></g>
<text class="th" x="134" y="634" text-anchor="middle" dominant-baseline="central" fill="#085041">NAS</text>
<text class="ts" x="134" y="650" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">파일 서버</text>

<rect x="256" y="574" width="44" height="44" rx="6" fill="#D85A30"/><g class="gl" transform="translate(266,584)"><rect x="3" y="7" width="12" height="12" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/></g>
<text class="th" x="278" y="634" text-anchor="middle" dominant-baseline="central" fill="#085041">Ubuntu VM × N</text>
<text class="ts" x="278" y="650" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">필요할 때 늘린다</text>

<rect x="376" y="416" width="248" height="256" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="th" x="500" y="440" text-anchor="middle" dominant-baseline="central" fill="#712B13">미니PC 2 · 네이티브</text>
<text class="ts" x="500" y="458" text-anchor="middle" dominant-baseline="central" fill="#993C1D">개인 서버</text>
<rect x="478" y="526" width="44" height="44" rx="6" fill="#D85A30"/><g class="gl" transform="translate(488,536)"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="3.5" r="2" fill="#fff" stroke="none"/><circle cx="4.6" cy="16.2" r="2" fill="#fff" stroke="none"/><circle cx="19.4" cy="16.2" r="2" fill="#fff" stroke="none"/></g>
<text class="th" x="500" y="586" text-anchor="middle" dominant-baseline="central" fill="#712B13">Ubuntu 서버</text>
<text class="ts" x="500" y="602" text-anchor="middle" dominant-baseline="central" fill="#993C1D">지금 주로 쓴다</text>
</svg>
