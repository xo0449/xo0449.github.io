rker-end="url(#a)"/><rect x="190" y="318" width="400" height="84" rx="12" fill="#eef8f3" stroke="#3fae7c"/><text x="390.0" y="356.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1f1f">뽀모도로 타이머 + 캐릭터</text><text x="390.0" y="378.0" text-anchor="middle" font-size="13" fill="#6f6f6b">매일 켜고, 돌볼수록 내일 또 켠다</text>
