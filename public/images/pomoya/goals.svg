<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="얻고 싶었던 것 세 가지에서 조건을 뽑아 뽀모도로 타이머와 캐릭터를 골랐다" font-family="-apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif">
