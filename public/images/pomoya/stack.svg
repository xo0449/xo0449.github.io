<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="뽀모야의 스택: 컴퓨터 앱과 폰 앱이 같은 캐릭터 규칙을 쓰고, 서버는 홈서버의 Docker에서 돌며, GitHub Actions가 배포한다" font-family="-apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', sans-serif">
<title>뽀모야의 스택: 컴퓨터 앱과 폰 앱이 같은 캐릭터 규칙을 쓰고, 서버는 홈서버의 Docker에서 돌며, GitHub Actions가 배포한다</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f6f6b"/></marker></defs>
